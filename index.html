<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoloLab 支持中心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
            line-height: 1.7; color: #1d1d1f; background: #fafafa; padding: 40px 20px;
        }
        .container {
            max-width: 720px; margin: 0 auto; background: #fff;
            border-radius: 16px; padding: 48px 40px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .subtitle { color: #86868b; font-size: 14px; margin-bottom: 32px; }
        h2 { font-size: 20px; font-weight: 600; margin-top: 32px; margin-bottom: 12px; }
        p { font-size: 15px; color: #1d1d1f; margin-bottom: 12px; }
        a { color: #0071e3; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .app-card {
            background: #f5f5f7; border-radius: 12px; padding: 24px; margin: 16px 0;
            transition: transform 0.2s;
        }
        .app-card:hover { transform: translateY(-2px); }
        .app-card h3 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
        .app-card p { font-size: 14px; color: #6e6e73; margin-bottom: 12px; }
        .app-card a {
            display: inline-block; font-size: 14px; font-weight: 500;
            color: #0071e3; margin-right: 16px;
        }
        .footer {
            margin-top: 40px; padding-top: 20px; border-top: 1px solid #e5e5e5;
            font-size: 13px; color: #86868b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SoloLab 支持中心</h1>

            <a href="remilo/privacy_policy.html">隐私政策</a>
            <a href="remilo/terms_of_use.html">使用条款</a>
            <a href="remilo/support.html">支持</a>

        <section class="app-card" id="focusclip">
            <h3>FocusClip</h3>
            <p>睡前少刷手机，第二天自动结算</p>
            <a href="focusclip/index.html">支持</a>
            <a href="focusclip/privacy_policy.html">隐私政策</a>
            <a href="focusclip/terms_of_use.html">使用条款</a>

        <div class="footer">
            <p>SoloLab Studio — <a href="mailto:sololab.studio.official@gmail.com">sololab.studio.official@gmail.com</a></p>
        </div>

</html>
